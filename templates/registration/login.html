{% extends "base.html" %}

{% block title %}Log in — DocuMind AI{% endblock %}

{% block body %}
<div class="auth-shell">
  <div class="paper auth-card">
    <div class="auth-brand">DocuMind AI</div>
    <div class="auth-tagline">Turn your PDFs into answers, not homework.</div>

    {% if form.errors %}
      <div class="alert alert-error">Your username and password didn't match. Try again.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label for="id_username">Username</label>
        <input type="text" name="username" id="id_username" autofocus required>
      </div>
      <div class="field">
        <label for="id_password">Password</label>
        <input type="password" name="password" id="id_password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
