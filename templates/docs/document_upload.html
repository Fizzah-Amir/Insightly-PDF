{% extends "app_base.html" %}
{% block title %}Upload — DocuMind AI{% endblock %}

{% block content %}
<div class="page-eyebrow">Add to your library</div>
<h1>Upload a PDF</h1>
<p>We'll extract the text, chunk it, embed it, and pull out key concepts automatically in the background.</p>

<div class="card mt-24" style="max-width: 480px;">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="field">
      <label for="id_title">Title</label>
      <input type="text" name="title" id="id_title" placeholder="e.g. Chapter 3 — Thermodynamics" required>
    </div>
    <div class="field">
      <label for="id_file">PDF file</label>
      <input type="file" name="file" id="id_file" accept="application/pdf" required>
    </div>
    <button type="submit" class="btn btn-primary">Upload &amp; Process</button>
  </form>
</div>
{% endblock %}
